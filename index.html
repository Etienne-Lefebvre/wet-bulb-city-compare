<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wet-Bulb City Compare</title>
  <meta name="description" content="Compare today's peak wet-bulb temperature and heat index between cities, plotted on the NOAA heat index chart.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;&#127777;&lt;/text&gt;&lt;/svg&gt;">
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <h1>Wet-Bulb City Compare</h1>
      <div class="lang-toggle" role="group" aria-label="Language / Español / Français">
        <button id="lang-en" class="lang-btn" aria-pressed="true" lang="en">English</button>
        <button id="lang-es" class="lang-btn" aria-pressed="false" lang="es">Español</button>
        <button id="lang-fr" class="lang-btn" aria-pressed="false" lang="fr">Français</button>
      </div>
    </div>
    <p class="tagline" data-i18n="tagline"></p>
  </header>

  <main>
    <section class="controls">
      <div class="search-box">
        <input id="city-search" type="search" autocomplete="off"
               aria-expanded="false" role="combobox" aria-controls="search-results">
        <ul id="search-results" role="listbox" hidden></ul>
      </div>
      <div class="day-toggle" role="group">
        <button id="day-today" class="day-btn active" aria-pressed="true" data-i18n="today"></button>
        <button id="day-tomorrow" class="day-btn" aria-pressed="false" data-i18n="tomorrow"></button>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>

    <section class="chart-wrap" aria-label="Heat index chart">
      <div id="chart"><!-- graph.svg is injected here --></div>
      <p class="chart-note" data-i18n-html="chartNote"></p>
    </section>

    <section class="city-list" aria-label="Selected cities">
      <table id="city-table" hidden>
        <thead>
          <tr>
            <th scope="col" data-i18n="thCity"></th>
            <th scope="col" data-i18n="thPeak"></th>
            <th scope="col" data-i18n="thAt"></th>
            <th scope="col" data-i18n="thAir"></th>
            <th scope="col" data-i18n="thHum"></th>
            <th scope="col" data-i18n="thHi"></th>
            <th scope="col"><span class="visually-hidden" data-i18n="thRemove"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty-hint" data-i18n="empty"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n-html="footer"></p>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
